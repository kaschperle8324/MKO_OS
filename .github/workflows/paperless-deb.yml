name: mko-paperless .deb

on:
  push:
    paths: ["paperless-desktop/**", ".github/workflows/paperless-deb.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-requests python3-pyfuse3 \
            python3-trio python3-dbus-next python3-keyring fuse3 dbus dpkg-dev
      - name: Selbsttest gegen Paperless-Nachbau
        working-directory: paperless-desktop
        env:
          PAPERLESS_URL: http://127.0.0.1:8765
          PAPERLESS_TOKEN: testtoken
        run: |
          python3 tests/mock_paperless.py 8765 &
          sleep 1
          python3 -m mko_paperless status
          python3 -m mko_paperless search rechnung
          dbus-run-session -- python3 tests/dbus_check.py
      - name: Paket bauen
        working-directory: paperless-desktop
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mko-paperless-deb
          path: paperless-desktop/dist/*.deb
