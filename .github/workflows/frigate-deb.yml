name: mko-frigate .deb

on:
  push:
    paths: ["frigate-desktop/**", ".github/workflows/frigate-deb.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-requests python3-keyring python3-aiohttp \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qtnetwork \
            libnotify-bin xdg-utils dpkg-dev fonts-dejavu-core
      - name: Test gegen Frigate-Nachbau
        working-directory: frigate-desktop
        env:
          QT_QPA_PLATFORM: offscreen
          FRIGATE_URL: http://127.0.0.1:18971
          FRIGATE_USER: admin
          FRIGATE_PASSWORD: geheim
        run: |
          python3 tests/mock_frigate.py --port 18971 --interval 0 &
          MOCK=$!
          for i in $(seq 1 30); do python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18971/api/login', data=b'{}')" 2>&1 | grep -q 401 && break; sleep 1; done
          python3 tests/ui_check.py
          python3 tests/mcp_check.py
          kill $MOCK
      - name: Paket bauen
        working-directory: frigate-desktop
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mko-frigate-deb
          path: frigate-desktop/dist/*.deb
